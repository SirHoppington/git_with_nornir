! Command: show running-config
! device: r2-lab (cEOSLab, EOS-4.34.2.1F-43860280.43421F (engineering build))
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$Etk42bgL0GwmXZUw$uP5etHMFR0U3gZJqsglOkzlpHMv5XStDuL9RasYhLUa4JpFofyRsDca6nNnFTBYgKEFXBXE/cv0.HiVLNP5T61
!
management api http-commands
   no shutdown
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname r2-lab
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
interface Ethernet1
   description to-r2
   no switchport
   ip address 10.0.0.2/30
!
interface Ethernet2
!
interface Loopback0
   ip address 10.10.10.2/32
!
interface Management0
   description containerlab mgmt
   ip address 10.2.0.100/24
!
ip routing
!
router bgp 65002
   router-id 10.10.10.2
   no bgp default ipv4-unicast
   neighbor 10.0.0.1 remote-as 65001
   neighbor 10.0.0.1 description to-r1-lab
   neighbor 10.0.0.1 send-community
   !
   address-family ipv4
      neighbor 10.0.0.1 activate
      network 10.10.10.2/32
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
end

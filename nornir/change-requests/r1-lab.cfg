interface Ethernet2
   description to-r2-lab1
   no switchport
   ip address 10.100.0.1/30

router bgp 65001
   neighbor 10.100.0.2 remote-as 65002
   neighbor 10.100.0.2 description srl-1
   neighbor 10.100.0.2 send-community
   !
   address-family ipv4
      neighbor 10.100.0.2 activate
      network 10.100.0.1/32
!
---
mgmt:
  ipv4-gw: 10.2.0.1
  ipv4-subnet: 10.2.0.0/24
  network: custom_mgmt_net
name: nornir-napalm
topology:
  kinds:
    arista_ceos:
      env:
        SKIP_ZEROTOUCH_BARRIER_IN_SYSDBINIT: 1
      image: ceos:4.34.2.1F
  links:
    - endpoints:
        - r1-lab:eth1
        - r2-lab:eth1
    - endpoints:
        - r1-lab:eth2
        - r2-lab:eth2
  nodes:
    r1-lab:
      kind: arista_ceos
      labels:
        nornir-group-1: dev
      mgmt-ipv4: 10.2.0.99
      startup-config: startup-configs/r1-lab.cfg
    r2-lab:
      kind: arista_ceos
      labels:
        nornir-group-1: dev
      mgmt-ipv4: 10.2.0.100
      startup-config: startup-configs/r2-lab.cfg

name: Dry Run changes

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# One dry run per PR at a time, and never two PRs hitting the devices at once.
concurrency:
  group: network-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: [self-hosted]
    name: Dry run change requests

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install requirements
        run: python3 -m pip install -r nornir/requirements.txt

      - name: Find changed change requests
        uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: shell
          filters: |
            crqs:
              - added|modified|deleted: nornir/change-requests/**

      - name: Dry run against the network
        if: steps.filter.outputs.crqs == 'true'
        working-directory: nornir
        run: |
          python3 configure_devices.py --dry_run --files "${{ steps.filter.outputs.crqs_files }}"

      # always() so a failed deploy still gets its error posted to the PR
      - name: Post diff to PR
        if: always() && steps.filter.outputs.crqs == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'nornir/diff.md';

            const body = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : '### Dry run failed before reaching the devices\n\nCheck the workflow logs.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });